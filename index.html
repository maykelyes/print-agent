<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סוכן תמחור דפוס</title>
<style>
  *{box-sizing:border-box;margin:0;font-family:Arial,sans-serif}
  body{background:#f5f5f5;display:flex;justify-content:center;padding:20px}
  .chat{width:100%;max-width:700px}
  h2{text-align:center;margin-bottom:15px}
  .agent-switcher{display:flex;justify-content:center;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:2px solid #007aff}
  .agent-btn{flex:1;padding:10px 16px;border:none;background:white;color:#007aff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
  .agent-btn.active{background:#007aff;color:white}
  .agent-btn:hover:not(.active){background:#e8f0fe}
  #messages{background:white;border-radius:12px;padding:20px;height:65vh;overflow-y:auto;margin-bottom:10px}
  .msg{margin:8px 0;padding:10px 14px;border-radius:10px;max-width:85%;white-space:pre-wrap;line-height:1.6}
  .user{background:#007aff;color:white;margin-left:auto}
  .agent{background:#e9e9eb}
  form{display:flex;gap:8px}
  input{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px}
  button{padding:12px 24px;border-radius:10px;border:none;background:#007aff;color:white;font-size:16px;cursor:pointer}
  #loading{display:none;text-align:center;color:#888;padding:10px}
</style>
</head>
<body>
<div class="chat">
  <h2 id="title">🖨️ סוכן תמחור דפוס</h2>
  <div class="agent-switcher">
    <button class="agent-btn active" onclick="switchAgent('general')" id="btn-general">🖨️ דפוס דיגיטלי</button>
    <button class="agent-btn" onclick="switchAgent('offset')" id="btn-offset">⚙️ דפוס אופסט</button>
  </div>
  <button onclick="newChat()" style="display:block;margin:0 auto 10px;padding:8px 20px;border-radius:8px;border:1px solid #ccc;background:white;color:#333;cursor:pointer;font-size:14px">🔄 שיחה חדשה</button>
  <div id="messages"></div>
  <div id="loading">⏳ הסוכן חושב...</div>
  <form onsubmit="send(event)">
    <input id="input" placeholder="כתוב הודעה..." autocomplete="off">
    <button>שלח</button>
  </form>
</div>
<script>
let sessionId = null;
let currentAgent = 'general';

const agentTitles = {
  general: '🖨️ סוכן דפוס דיגיטלי',
  offset: '⚙️ סוכן דפוס אופסט'
};

function switchAgent(agent) {
  if (agent === currentAgent) return;
  currentAgent = agent;
  sessionId = null;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('title').textContent = agentTitles[agent];
  document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + agent).classList.add('active');
}

function newChat(){
  sessionId=null;
  document.getElementById('messages').innerHTML='';
}
function md(text) {
  // Escape HTML, then convert basic markdown to HTML
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return s;
}
function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'agent') {
    div.innerHTML = md(text);
  } else {
    div.textContent = text;
  }
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = 999999;
  return div;
}
async function send(e) {
  e.preventDefault();
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg(msg, 'user');
  document.getElementById('loading').style.display = 'block';
  const loadEl = document.getElementById('loading');
  let elapsed = 0;
  const tick = setInterval(() => {
    elapsed++;
    loadEl.textContent = '⏳ הסוכן חושב... ' + elapsed + ' שניות';
  }, 1000);

  const agentDiv = addMsg('', 'agent');
  let agentRaw = '';

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 300000); // 5 min

    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, session_id: sessionId, agent: currentAgent}),
      signal: controller.signal
    });
    clearTimeout(timeout);

    if (!res.ok || !res.body) {
      const errText = await res.text().catch(() => '');
      agentDiv.textContent = 'שגיאה בתקשורת עם השרת (' + res.status + '). נסה שוב.\n' + errText;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'text') {
            agentRaw += data.text;
            agentDiv.innerHTML = md(agentRaw);
            document.getElementById('loading').style.display = 'none';
          } else if (data.type === 'error') {
            agentRaw += data.text;
            agentDiv.innerHTML = md(agentRaw);
            document.getElementById('loading').style.display = 'none';
          } else if (data.type === 'session_reset') {
            sessionId = null;
          } else if (data.type === 'session') {
            sessionId = data.session_id;
          } else if (data.type === 'status') {
            if (data.event === 'session_recovery') {
              document.getElementById('loading').textContent = '🔄 מתאושש...';
            } else if (data.elapsed) {
              document.getElementById('loading').textContent = '⏳ הסוכן עובד... ' + data.elapsed + ' שניות';
            } else {
              document.getElementById('loading').textContent = '⏳ הסוכן עובד...';
            }
          }
        } catch {}
      }
      document.getElementById('messages').scrollTop = 999999;
    }

    if (!agentRaw) {
      agentDiv.textContent = 'לא התקבלה תשובה מהסוכן. נסה שוב.';
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      agentDiv.textContent = '⏳ הבקשה ארכה יותר מדי זמן. נסה שוב.';
    } else {
      agentDiv.textContent = agentRaw || 'שגיאה בתקשורת עם השרת. נסה שוב.';
    }
  } finally {
    clearInterval(tick);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('loading').textContent = '⏳ הסוכן חושב...';
  }
}
</script>
</body>
</html>
